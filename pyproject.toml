[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "australian-insurance-analytics"
version = "1.0.0"
description = "APRA portfolio analytics and educational freMTPL2 pricing workbench"
requires-python = ">=3.12,<3.13"
dependencies = [
  "duckdb>=1.3,<2",
  "huggingface-hub>=0.33,<1",
  "joblib>=1.5,<2",
  "jupyter>=1.1,<2",
  "nbformat>=5.10,<6",
  "numpy>=2.1,<3",
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<3.1",
  "plotly>=6.2,<7",
  "pyarrow>=20,<22",
  "python-dotenv>=1.1,<2",
  "scikit-learn>=1.7,<2",
  "statsmodels>=0.14.5,<1",
  "streamlit>=1.47,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9", "ruff>=0.12,<1"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [".venv", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"scripts/generate_reports.py" = ["E501"]
